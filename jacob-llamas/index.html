<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Jacob Llamas – Fresh Freight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Open Sans', Arial, sans-serif;
      background: #f2f2f2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 40px;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      width: 100%;
      max-width: 460px;
      min-height: 540px;
      overflow: hidden;
      box-shadow: 0 2px 16px rgba(4,7,2,0.08);
    }
    .card-body { padding: 32px 28px 28px; }
    .logo-wrap { display: flex; justify-content: center; margin-bottom: 28px; }
    .logo-wrap img { height: 44px; width: auto; }
    .name-block { text-align: center; padding-bottom: 24px; border-bottom: 0.5px solid #d9d9d9; margin-bottom: 24px; }
    .name { font-family: 'Montserrat', Arial, sans-serif; font-weight: 700; font-size: 22px; color: #040702; text-transform: uppercase; letter-spacing: 0.5px; line-height: 1.2; margin-bottom: 4px; }
    .title { font-family: 'Open Sans', Arial, sans-serif; font-weight: 400; font-size: 12px; color: #818380; text-transform: uppercase; letter-spacing: 1px; }
    .contact-list { display: flex; flex-direction: column; gap: 16px; margin-bottom: 28px; }
    .contact-item { display: flex; align-items: flex-start; gap: 12px; text-decoration: none; color: inherit; }
    .contact-item:active { opacity: 0.7; }
    .contact-icon { width: 20px; height: 20px; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; }
    .contact-text { font-family: 'Open Sans', Arial, sans-serif; font-size: 14px; color: #1d1f1b; font-weight: 400; line-height: 1.5; }
    .contact-text .label { display: block; font-size: 10px; color: #818380; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 1px; }
    .save-btn { display: block; width: 100%; padding: 14px; background: #4a8b2c; color: #ffffff; font-family: 'Montserrat', Arial, sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.8px; text-transform: uppercase; text-align: center; border: none; border-radius: 8px; cursor: pointer; text-decoration: none; transition: background 0.15s; }
    .save-btn:hover { background: #3b6f23; }
    .save-btn:active { background: #1d3711; }
    .tagline { text-align: center; font-family: 'Montserrat', Arial, sans-serif; font-size: 9px; font-weight: 600; color: #040702; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 20px; }
  </style>
</head>

      </div>
      <a class="save-btn" href="https://fresh-freight.github.io/fresh-freight-cards/jacob-llamas/jacob-llamas.vcf" download="jacob-llamas.vcf">Save Contact</a>
      <p class="tagline">Determined to Deliver&#8482;</p>

  </div>

</html>
